# ==============================================================================================================
# Cross-syntax round trip (test_cross_syntax.py, issue #30): UBL -> model -> CII -> model and CII -> model -> UBL
# ==============================================================================================================
#
# Only samples that read (the [[sample]] entries above with outcome "parse-error" never get here). Every entry is
# asserted exactly, never skipped:
#
#   source, file  the sample, as above
#   outcome       "refuses": the other syntax's writer raises a ModelError naming exactly `rules` (a documented gap
#                 of that syntax, docs/reference/bt-mapping.md)
#                 "reads": validate() of the other syntax's output has exactly `rules` as fatal/error rule ids
#   differs       optional, "reads" only: BT/BG ids (of the innermost differing fields) where the round trip differs
#                 beyond the documented writer normalizations, exactly (a tracked gap; `reason` names its issue)
#   reason        why, citing bt-mapping.md or the rule texts
#
# The writer normalizations of bt-mapping.md ("Normalizations": BT-148 derived in CII, BT-147 derived in UBL) are
# applied by the test itself (_as_written), not listed here.

