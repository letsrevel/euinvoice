# Upstream samples that do not satisfy the round-trip invariant of plan §4 (IMPLEMENTATION_PLAN.md §8 9.1).
#
# The single source of truth for test_corpus_harness.py (and test_orchestration_official.py).
# Every entry is asserted, never skipped: a sample that starts to pass, or fails differently, fails the harness.
#
#   source, file  the sample: a pinned source (validate/manifest.toml) and the path in its cache directory;
#                 for a Factur-X PDF the path of the PDF (the sample is its embedded XML)
#   outcome       "parse-error": read(X) raises a ParseError whose message names exactly `rules` (rule/BT/BG ids)
#                 "reads": X reads, and validate(write(read(X))) has exactly `rules` as fatal/error rule ids
#   upstream      the fatal/error rule ids of validate(X) on the upstream file itself, exactly
#   differs       optional, "reads" only: BT/BG ids where read(write(read(X))) != read(X) (a tracked gap)
#   reason        why, citing the official rule texts and the open issue where there is one
#   link          the upstream file at the pinned version
#
# Validation profile: the one detect() finds from BT-24 (EN 16931 core when none); for a PDF the one its XMP
# fx:ConformanceLevel selects. Factur-X levels whose Schematron is not pinned (#42) run the EN 16931 core rules.
# validate() reports the raw official flags; KoSIT customLevel overrides are not applied (#49).
#
# Reasons quote the pinned versions (cen 1.3.16, peppol-bis 3.0.21, xrechnung-schematron 2.6.0, KoSIT testsuite and
# validator configuration 2026-08-31, ZUGFeRD corpus d891458e9822): on a pin bump, grep them and update.

# --------------------------------------------------------------------------------------------------------------
# CEN examples
# --------------------------------------------------------------------------------------------------------------

[[sample]]
source = "cen-ubl"
file = "examples/issue116.xml"
outcome = "reads"
rules = ["PEPPOL-COMMON-R049"]
upstream = ["PEPPOL-COMMON-R049"]
reason = "Peppol BT-24, so validate() runs the Peppol rules (#64); CEN promises the example valid against the CEN rules only. Its placeholder Swedish organisation numbers (EAS 0007, e.g. CompanyID 1234567890) fail the check digit of PEPPOL-COMMON-R049 (fatal, 'Swedish organization number MUST be stated in the correct format', peppol-bis 3.0.21 PEPPOL-EN16931-UBL.sch); the round trip keeps them."
link = "https://github.com/ConnectingEurope/eInvoicing-EN16931/blob/validation-1.3.16/ubl/examples/issue116.xml"

# --------------------------------------------------------------------------------------------------------------
# KoSIT XRechnung testsuite: the raw-flag side of KoSIT customLevel overrides (#49)
# --------------------------------------------------------------------------------------------------------------

[[sample]]
source = "xrechnung-testsuite"
file = "instances/extension/04.05a-INVOICE_uncefact.xml"
outcome = "parse-error"
rules = ["BR-CL-10", "BR-CL-11", "BR-CL-26", "BT-60"]
upstream = ["BR-CL-10", "BR-CL-21"]
reason = "XRechnung extension: GlobalID schemeID=\"XR03\" is not in the ISO 6523 ICD list (BR-CL-10, BR-CL-21 fatal on the upstream file), which the model enforces too (D8 permits refusing what the CEN Schematron refuses). KoSIT's scenarios.xml (xrechnung-validator-configuration 2026-08-31) downgrades exactly these rules with <customLevel level=\"information\"> in the scenario the instance matches; validate() reports raw flags (#49)."
link = "https://github.com/itplr-kosit/xrechnung-testsuite/blob/v2026-08-31/src/test/business-cases/extension/04.05a-INVOICE_uncefact.xml"

[[sample]]
source = "xrechnung-testsuite"
file = "instances/extension/05.01a-INVOICE_ubl.xml"
outcome = "reads"
rules = ["BR-CO-16", "BR-DEX-09"]
upstream = ["BR-CO-16"]
reason = "XRechnung extension with cac:PrepaidPayment (third party payments BT-DEX-002, UBL-CR-470): BT-115 = BT-112 - BT-113 + BT-114 does not hold within EN 16931 core, so the upstream file fails BR-CO-16 (fatal). KoSIT's scenarios.xml (xrechnung-validator-configuration 2026-08-31) downgrades exactly these rules with <customLevel level=\"information\"> in the scenario the instance matches; validate() reports raw flags (#49). BR-DEX-09 (fatal, 'BT-115 = BT-112 - BT-113 + BT-114 + \u03a3 BT-DEX-002') fails only after the round trip: the PrepaidPayment is outside EN 16931, so the reader reports it unmapped and write(read(X)) lacks it."
link = "https://github.com/itplr-kosit/xrechnung-testsuite/blob/v2026-08-31/src/test/business-cases/extension/05.01a-INVOICE_ubl.xml"

[[sample]]
