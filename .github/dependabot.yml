version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
    ignore:
      # SaxonC-HE 13.0.0 normalize-space() crash; the [validate] extra excludes it (issue #74).
      - dependency-name: "saxonche"
        versions: ["13.0.0"]
