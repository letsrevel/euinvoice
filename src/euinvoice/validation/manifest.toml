# Pinned official validation artifacts and upstream example corpora (IMPLEMENTATION_PLAN.md D7, §3).
#
# Nothing listed here is ever committed. `python -m euinvoice artifacts fetch` downloads each source,
# checks its sha256, and extracts the matching members of a zip archive (or stores a single file) into
# `$EUINVOICE_ARTIFACTS_DIR/<source>/<version>/` (default `~/.cache/euinvoice`).
#
# Fields per source:
#   version           directory name under the cache; bump it together with url + sha256
#   url               https download of a zip archive, or of a single file (see `file`)
#   sha256            of the downloaded bytes, computed from a real download
#   license           licence of the upstream content (we only fetch, never redistribute)
#   members           fnmatch globs over the archive member paths after `strip_components`;
#                     `*` also matches `/`, so "rules/sch/*" includes subdirectories
#   file              instead of `members`: the download is one file, stored under this name in the
#                     version directory (no strip_components / precompile)
#   strip_components  leading path components to drop (GitHub archives wrap everything in one dir)
#   precompile        `.sch` files (relative to the extracted dir) that ship without compiled XSLT;
#                     they are compiled with SchXslt (source `schxslt`) into a sibling `.xslt`
#   note              what the archive contains and why it is pinned at this version
#
# Changing a pin: update version + url + sha256 together, run `make conformance`, add a CHANGELOG
# note and open a dedicated PR (CLAUDE.md, "Artifacts and fixtures").
#
# ponytail: Factur-X / ZUGFeRD specification package (per-profile XSD + Schematron) is NOT pinned.
# FNFE-MPE (fnfe-mpe.org/factur-x, Factur-X 1.09.2) and FeRD (ferd-net.de, ZUGFeRD 2.5.2) only
# serve it behind an e-mail form, with no stable direct URL. Tracked as a needs-human question;
# add a `facturx` source here once an official direct URL (or a maintainer-provided mirror) exists.

schema_version = 1

